# Preserve the scheme set by the TLS terminator (Tailscale Funnel sends
# X-Forwarded-Proto: https). Fall back to this hop's $scheme when the header is
# absent or unrecognized, so the backend can mark session cookies Secure only on
# HTTPS. Do not trust arbitrary values: only http/https are forwarded.
map $http_x_forwarded_proto $forwarded_proto {
    default    $scheme;
    "~*^https$" https;
    "~*^http$"  http;
}

upstream api_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Staged rollout: keep basic auth until the app's Twitch login is verified,
    # then remove these two lines and the htpasswd mount in docker-compose.yml.
    auth_basic "Twitch Drops Manager";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Compress JSON/CSS/JS on the wire. API responses are proxied, so
    # gzip_proxied must allow them explicitly.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Bundled assets are content-hashed by Vite; cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The entry point must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
