# Preserve the scheme set by the TLS terminator (Tailscale Funnel sends
# X-Forwarded-Proto: https). Fall back to this hop's $scheme when the header is
# absent or unrecognized, so the backend can mark session cookies Secure only on
# HTTPS. Do not trust arbitrary values: only http/https are forwarded.
map $http_x_forwarded_proto $forwarded_proto {
    default    $scheme;
    "~*^https$" https;
    "~*^http$"  http;
}

upstream api_backend {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Do not advertise the nginx version in responses or error pages.
    server_tokens off;

    # Trust only the local TLS terminator (Tailscale Funnel on loopback) when
    # resolving the client address. A client-supplied X-Forwarded-For from any
    # other source is ignored, and the API receives exactly one address, so the
    # auth rate limiter cannot be keyed by a spoofed header. If the proxy source
    # is not loopback, add its address here instead of trusting all proxies.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Browser security headers. nginx drops inherited add_header directives in
    # any location that declares its own add_header, so the /assets/ and
    # /index.html blocks below repeat this set alongside their Cache-Control.
    # Keep the three copies in sync.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The SPA ships only external scripts/styles from its own origin. Twitch
    # avatars/campaign art come from https hosts; connect-src stays same-origin
    # (the API is proxied under /api/). style-src needs 'unsafe-inline' for the
    # app's inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Access control is the app's Twitch login + invite code. Personal API
    # endpoints require a server-side session; /health stays public for Kuma.

    # Compress JSON/CSS/JS on the wire. API responses are proxied, so
    # gzip_proxied must allow them explicitly.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/json
        application/javascript
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Bundled assets are content-hashed by Vite; cache them aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        try_files $uri =404;
    }

    # The entry point must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
