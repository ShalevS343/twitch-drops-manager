x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://drops:drops@db:5432/drops
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  DROPS_API_KEY: ${DROPS_API_KEY:-}
  DEFAULT_GAMES: ${DEFAULT_GAMES:-Rust,Minecraft}
  POLL_SECONDS: ${POLL_SECONDS:-900}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8282}
  API_TOKEN: ${API_TOKEN:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: drops
      POSTGRES_USER: drops
      POSTGRES_PASSWORD: drops
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend
    image: twitch-drops-backend:local
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../backend
    image: twitch-drops-backend:local
    command: ["python", "-m", "app.worker.scheduler"]
    environment:
      <<: *backend-env
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_TOKEN: ${API_TOKEN:-}
    ports:
      - "8282:80"
    depends_on:
      - api

volumes:
  db_data:
