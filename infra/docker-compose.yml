x-backend-env: &backend-env
  DATABASE_URL: sqlite+aiosqlite:////data/drops.db
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  TWITCH_DEVICE_CLIENT_ID: ${TWITCH_DEVICE_CLIENT_ID:-}
  TWITCH_DEVICE_CLIENT_SECRET: ${TWITCH_DEVICE_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  DROPS_API_KEY: ${DROPS_API_KEY:-}
  DEFAULT_GAMES: ${DEFAULT_GAMES:-Rust,Minecraft}
  POLL_SECONDS: ${POLL_SECONDS:-900}
  PROGRESS_POLL_SECONDS: ${PROGRESS_POLL_SECONDS:-300}
  WATCHER_POLL_SECONDS: ${WATCHER_POLL_SECONDS:-60}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8282}
  # Multi-user auth (see docs/OPERATIONS.md).
  REGISTRATION_CODE: ${REGISTRATION_CODE:-}
  REGISTRATION_OPEN: ${REGISTRATION_OPEN:-false}
  OWNER_TWITCH_ID: ${OWNER_TWITCH_ID:-}
  SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-}
  AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-10}
  AUTH_GLOBAL_RATE_LIMIT_PER_MINUTE: ${AUTH_GLOBAL_RATE_LIMIT_PER_MINUTE:-120}

services:
  api:
    build:
      context: ../backend
    image: twitch-drops-backend:local
    environment:
      <<: *backend-env
    volumes:
      - drops_data:/data
    ports:
      - "127.0.0.1:8000:8000"

  worker:
    build:
      context: ../backend
    image: twitch-drops-backend:local
    command: ["python", "-m", "app.worker.scheduler"]
    environment:
      <<: *backend-env
    volumes:
      - drops_data:/data
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ../frontend
    ports:
      - "8282:80"
    depends_on:
      - api
    labels:
      - homepage.group=Media
      - homepage.name=Twitch Drops Manager
      - homepage.icon=twitch.png
      - homepage.href=http://100.115.65.82:8282
      - homepage.description=Track Twitch Drops campaigns and live streams

volumes:
  drops_data:
