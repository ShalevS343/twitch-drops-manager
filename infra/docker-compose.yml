x-backend-env: &backend-env
  DATABASE_URL: sqlite+aiosqlite:////data/drops.db
  TWITCH_CLIENT_ID: ${TWITCH_CLIENT_ID:-}
  TWITCH_CLIENT_SECRET: ${TWITCH_CLIENT_SECRET:-}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
  DROPS_API_KEY: ${DROPS_API_KEY:-}
  DEFAULT_GAMES: ${DEFAULT_GAMES:-Rust,Minecraft}
  POLL_SECONDS: ${POLL_SECONDS:-900}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8282}
  API_TOKEN: ${API_TOKEN:-}

services:
  api:
    build:
      context: ../backend
    image: twitch-drops-backend:local
    environment:
      <<: *backend-env
    volumes:
      - drops_data:/data
    ports:
      - "8000:8000"
    labels:
      - kuma.enable=true
      - kuma.name=Twitch Drops Manager API
      - kuma.port=8000
      - kuma.type=tcp

  worker:
    build:
      context: ../backend
    image: twitch-drops-backend:local
    command: ["python", "-m", "app.worker.scheduler"]
    environment:
      <<: *backend-env
    volumes:
      - drops_data:/data
    depends_on:
      api:
        condition: service_started

  frontend:
    build:
      context: ../frontend
      args:
        VITE_API_TOKEN: ${API_TOKEN:-}
    ports:
      - "8282:80"
    depends_on:
      - api
    labels:
      - homepage.group=Media
      - homepage.name=Twitch Drops Manager
      - homepage.icon=twitch.png
      - homepage.href=http://100.115.65.82:8282
      - homepage.description=Track Twitch Drops campaigns and live streams
      - kuma.enable=true
      - kuma.name=Twitch Drops Manager
      - kuma.port=8282
      - kuma.type=tcp

volumes:
  drops_data:
